<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form homework 2</title>
</head>

<body>
    <h1>Pete's Pizza Delivery</h1>
    <h2>Online Order Form</h2>
    <p><b>*</b> required fields</p>
    <fieldset>
        <legend>Customer detail</legend>
        <table>
            <tr>
                <td>
                    <label for="name">name:</label>
                </td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="add">address</label>
                </td>
                <td>
                    <input type="text" id="add" name="add">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="tc">Town/City:</label>
                </td>
                <td>
                    <input type="text" id="tc" name="tc">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="post">PostCode:</label>
                </td>
                <td>
                    <input type="text" id="post" name="post">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="tel">Tel:</label>
                </td>
                <td>
                    <input type="text" id="tel" name="tel">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email:</label>
                </td>
                <td>
                    <input type="text" id="email" name="email">
                </td>
            </tr>
        </table>
    </fieldset>

    <table>
        <tr>
            <td>
                <fieldset>
                    <legend>Topping:</legend>
                    <input type="radio" id="mag" name="rol">
                    <label for="mag">Margherita</label><br>
                    <input type="radio" id="sea" name="rol">
                    <label for="sea">Four Seasons</label> <br>
                    <input type="radio" id="fea" name="rol">
                    <label for="fea">Meat Feast</label>
                </fieldset>
            </td>
            <td>
                <fieldset>
                    <legend>Size:</legend>
                    <input type="radio" id="small" name="roll">
                    <label for="small">Small</label><br>
                    <input type="radio" id="med" name="roll">
                    <label for="med">Medium</label> <br>
                    <input type="radio" id="lar" name="roll">
                    <label for="lar">Large</label>
                </fieldset>
            </td>
            <td>
                <fieldset>
                    <legend>Extras</legend>
                    <input type="checkbox" id="mus">
                    <label for="mus">Mushrooms</label><br>
                    <input type="checkbox" id="gre">
                    <label for="gre">Green peppers</label><br>
                    <input type="checkbox" id="anc">
                    <label for="anc">Anchovies</label><br>
                     <input type="checkbox" id="ext">
                    <label for="ext">Extra cheese</label>
                </fieldset>
            </td>
        </tr>
    </table>

    <fieldset>
        <legend>Delivery</legend>
        <label for="time">Preferred delivery time</label>
        <input type="time" id="time" name="time"><br><br>
        <label for="ins">Delivery instuctions</label> 
        <input type="textarea" id="ins" name="ins" row="10px" col="5px"> 
    </fieldset><br>
    <button type="submit">submit order</button>
</body>

</html>
