<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form homework 1</title>
</head>
<body>
    <h1>Novell Services Login</h1>
    <form action="">
        <label for="username">username:</label>
        <input type="text"  id="username"  name="username">
        <br><br>
        <label for="pass">Password:</label>
        <input type="password"  id="pass"  name="pass">
        <br><br>
        <label for="username">City of employment:</label>
        <input type="text"  id="city"  name="city">
        <br><br>
          <label for="server">Web Server:</label>
        <select name="server" id="server">
            <option>choose a server</option>
            <option>server 1</option>
            <option>server 2</option>
            <option>server 3</option>
        </select>
        <br><br>
        <!-- to make a separate mark for separate name we have to apply the same name... -->
        <label for="role">please specify your role:</label> <br>
        <input type="radio" id="admin"  name="role">
         <label for="admin">Admin</label>
        <br>
        <input type="radio" id="eng"  name="role">
        <label for="eng">Engineer</label> 
        <br>
        <input type="radio" id="mng"  name="role">
        <label for="mng">Manager</label> 
        <br>
        <input type="radio" id="guest"  name="role">
        <label for="guest">Guest</label> 
        <br><br>
        <label for="sign">Single sign-on to the following:</label>
        <br>
        <input type="checkbox" id="mail"  name="mail"> 
        <label for="mail">Mail</label>
        <br>
        <input type="checkbox" id="payroll" name="payroll">
       <label for="payroll">Payroll</label>
        <br>
        <input type="checkbox" id="self" name="self">
        <label for="self">Self-Service</label>
        <br><br>
        <button type="submit">Login</button>
        <button type="submit">reset</button>
        
    </form>
</body>
</html>
